services:
  postgres:
    image: postgres:16-alpine
    container_name: memory-battle-db-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: memory_arena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: builder
    container_name: memory-battle-backend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/memory_arena?schema=public
      JWT_SECRET: dev-secret-key
      JWT_EXPIRES_IN: 1d
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CALLBACK_URL: ${NGROK_URL:-http://localhost:3000}/api/v1/auth/line/callback
      FRONTEND_URL: http://${LOCAL_IP:-localhost}:3001
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/prisma:/app/prisma
      - ./packages/shared/src:/app/packages/shared/src
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    container_name: memory-battle-ngrok
    restart: unless-stopped
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_ARGS: --log=stdout
    command: "http backend:3000"
    depends_on:
      - backend

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: builder
    container_name: memory-battle-frontend-dev
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://${LOCAL_IP:-localhost}:3000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://${LOCAL_IP:-localhost}:3000
      NEXT_PUBLIC_LINE_CLIENT_ID: ${LINE_CLIENT_ID:-}
      NEXT_PUBLIC_LINE_CALLBACK_URL: ${NGROK_URL:-http://localhost:3000}/api/v1/auth/line/callback
      BACKEND_INTERNAL_URL: http://backend:3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/frontend/src:/app/src
      - ./apps/frontend/public:/app/public
    command: npm run dev
    depends_on:
      - backend

volumes:
  postgres_dev_data:
